<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Slide-change review — where the picture changes</title>
<style>
:root{--bg:#0f1524;--pn:#151d31;--ln:#26314b;--tx:#e8edf7;--t2:#a8b6d2;--dm:#6a7898;
--ok:#3FD0C9;--wn:#F2A33C;--bd:#FF6B6B;--pr:#7FB2F0;--now:#FFD84D}
*{box-sizing:border-box}
body{margin:0;padding:22px 20px 90px;background:var(--bg);color:var(--tx);
font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px;font-weight:650}
.sub{color:var(--t2);font-size:13px;margin-bottom:16px}.sub b{color:var(--tx)}
.counts{display:flex;flex-wrap:wrap;gap:20px;padding:12px 16px;margin-bottom:16px;
background:var(--pn);border:1px solid var(--ln);border-radius:8px;font-size:13px;color:var(--t2)}
.counts b{color:var(--tx);font-size:16px;font-weight:650}
.counts .s b{color:var(--ok)} .counts .w b{color:var(--wn)}
.ev{background:var(--pn);border:1px solid var(--ln);border-radius:10px;
padding:14px 16px;margin-bottom:14px}
.ev.strong{border-left:3px solid var(--ok)} .ev.weak{border-left:3px solid var(--wn)}
.hd{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.t{font-family:ui-monospace,Menlo,monospace;font-size:17px;color:var(--pr);font-weight:600}
.tier{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;
border-radius:99px;font-weight:600}
.tier.strong{background:rgba(63,208,201,.15);color:var(--ok)}
.tier.weak{background:rgba(242,163,60,.15);color:var(--wn)}
.meta{color:var(--dm);font-size:12px;font-family:ui-monospace,Menlo,monospace}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.pair{grid-template-columns:1fr}}
.side{min-width:0}
.cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dm);
margin-bottom:5px;font-weight:600}
img{width:100%;height:auto;display:block;border-radius:5px;border:1px solid var(--ln);background:#000}
.noimg{padding:26px;text-align:center;color:var(--dm);font-size:12px;
border:1px dashed var(--ln);border-radius:5px}
.line{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--t2);
background:rgba(255,255,255,.03);border:1px solid var(--ln);border-radius:5px;
padding:8px 11px;margin-top:11px;user-select:all}
h3{font-size:12px;margin:28px 0 8px;color:var(--t2);text-transform:uppercase;
letter-spacing:.08em;font-weight:600}
.note{font-size:13px;color:var(--t2);background:var(--pn);border:1px solid var(--ln);
border-radius:8px;padding:12px 16px}
.note code{color:var(--tx);font-size:12.5px}
footer{margin-top:32px;color:var(--dm);font-size:11.5px;line-height:1.6}
</style></head><body><div class="wrap" id="app"></div>

<!-- ══════════════════════════════════════════════════════════════════════
     THE CHANGES. Replace the contents of this block and change nothing
     else. The page renders whatever is here, so the two cannot disagree.
     ══════════════════════════════════════════════════════════════════════ -->
<script type="application/json" id="manifest">
{"video_id":"REPLACE_ME","metadata":{},"changes":[]}
</script>

<script>
const D = JSON.parse(document.getElementById('manifest').textContent);
const M = D.metadata || {}, C = D.changes || [];
const e = s => s==null?'':String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${(s%60).toFixed(2).padStart(5,'0')}`;

const strong = C.filter(c => c.tier === 'strong').length;

const cards = C.map((c, i) => {
  const img = (src, cap) => `<div class="side"><div class="cap">${cap}</div>` +
    (src ? `<img src="${src}" alt="${cap}">` : `<div class="noimg">no frame embedded —
     re-run with <code>--thumbs</code></div>`) + `</div>`;
  return `<div class="ev ${e(c.tier)}">
    <div class="hd">
      <span class="t">${mmss(c.t)}</span>
      <span class="tier ${e(c.tier)}">${e(c.tier)}</span>
      <span class="meta">score ${c.score} · cluster ${mmss(c.spans_s[0])}–${mmss(c.spans_s[1])}
        · ${c.frames_in_cluster} frame(s)</span>
    </div>
    <div class="pair">
      ${img(c.before, 'before')}
      ${img(c.after, 'after')}
    </div>
    <div class="line">${mmss(c.t)} | slide_change | </div>
  </div>`;
}).join('');

document.getElementById('app').innerHTML = `
<h1>${e(D.video_id)} — slide-change review</h1>
<div class="sub"><b>${e(M.source_file||'')}</b>
 ${M.duration_s?`· ${mmss(M.duration_s)}`:''}
 ${M.sample_fps?`· sampled ${M.sample_fps}/s at ${(M.sample_size||[]).join('×')}`:''}</div>

<div class="counts">
 <span class="s"><b>${strong}</b> strong</span>
 <span class="w"><b>${C.length - strong}</b> weak</span>
 <span>threshold <b>${M.threshold}</b> / <b>${M.weak_threshold}</b></span>
 <span>noise floor p99 <b>${M.noise_floor_p99}</b></span>
</div>

<div class="note"><b>What you are deciding.</b> The tool found where the picture
changed. It does not know <i>why</i>. Look at each pair and say which it is —
a slide turn, a build inside one slide, or neither. Opening and closing fades
score high and are <b>not</b> slide changes.</div>

${cards}

<h3>How to record your verdicts</h3>
<div class="note">Each card carries a pre-filled line. Copy it into
<code>&lt;video&gt;.changes.txt</code> and set the middle field:
<br><br>
<code>slide_change</code> · the deck advanced<br>
<code>in_slide_build</code> · same slide, something appeared<br>
<code>not_a_change</code> · fade, cursor, compression wobble<br>
<code>ask</code> · cannot tell from two frames
<br><br>
Same three-field format as the transcript review, so one habit covers both.</div>

<footer>Rendered from the data embedded in this file, so the cards and the JSON
cannot disagree. The metric is the mean absolute difference between consecutive
greyscale frames on a 0–255 scale — a slide turn moves most of the picture at
once; a cursor does not. A pause in the narration is not a slide change: on V017
the professor stops at 4:09 and the slide turns at 4:13.75.</footer>`;
</script></body></html>
