<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 660" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5FD4C7"/>
    </marker>
    <marker id="arC" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8792A3"/>
    </marker>
    <style>
      .bl   { fill:#E6EDF3; font-size:15px; font-weight:600; }
      .sb   { fill:#9AA6B8; font-size:11.5px; }
      .mono { fill:#5FD4C7; font-size:11.5px; font-family:'JetBrains Mono','Courier New',monospace; }
      .lbl  { fill:#6B7383; font-size:11px; font-weight:600; letter-spacing:0.16em; }
      .grpL { fill:#7E899B; font-size:12px; font-weight:700; letter-spacing:0.14em; }
      .note { fill:#8792A3; font-size:10.5px; font-style:italic; }
      .fl   { stroke:#5FD4C7; stroke-width:1.8; fill:none; }
      .flC  { stroke:#8792A3; stroke-width:1.6; fill:none; }
      .proc { fill:rgba(95,212,199,0.09); stroke:#5FD4C7; stroke-width:1.5; }
      .inp  { fill:rgba(232,163,61,0.11); stroke:#E8A33D; stroke-width:1.6; stroke-dasharray:6 4; }
      .cfg  { fill:rgba(135,146,163,0.10); stroke:#8792A3; stroke-width:1.5; }
      .grp  { fill:none; stroke:#2C3346; stroke-width:1.4; stroke-dasharray:6 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="620" height="660" fill="#0B0E14"/>

  <!-- ============ FUTURE (not built) ============ -->
  <rect x="20" y="30" width="170" height="56" rx="8" class="cfg" stroke-dasharray="5 4"/>
  <text x="105" y="52" text-anchor="middle" class="sb">Future: config UI</text>
  <text x="105" y="72" text-anchor="middle" class="note">not built — out of scope</text>
  <path d="M190,58 L210,58 L210,65 L225,65" class="flC" stroke-dasharray="5 4" marker-end="url(#arC)"/>

  <!-- ============ INPUT ============ -->
  <text x="225" y="20" class="lbl">INPUT · ALREADY COMMITTED</text>
  <rect x="225" y="30" width="250" height="70" rx="10" class="inp"/>
  <text x="350" y="56" text-anchor="middle" class="bl">Style contract JSON</text>
  <text x="350" y="76" text-anchor="middle" class="sb">provided directly today</text>
  <text x="350" y="94" text-anchor="middle" class="mono">res/config/style/global_style_contract.json</text>
  <line x1="350" y1="100" x2="350" y2="180" class="flC" marker-end="url(#arC)"/>

  <!-- ============ services/config/ group ============ -->
  <rect x="200" y="150" width="300" height="360" rx="16" class="grp"/>
  <text x="478" y="170" text-anchor="end" class="grpL">CONFIG/</text>

  <!-- Parse -->
  <rect x="220" y="180" width="260" height="64" rx="9" class="proc"/>
  <text x="350" y="204" text-anchor="middle" class="bl" font-size="14">Parse — loader.py</text>
  <text x="350" y="226" text-anchor="middle" class="mono">reads &amp; parses JSON only</text>
  <line x1="350" y1="244" x2="350" y2="264" class="fl" marker-end="url(#ar)"/>

  <!-- Validate -->
  <rect x="220" y="264" width="260" height="64" rx="9" class="proc"/>
  <text x="350" y="288" text-anchor="middle" class="bl" font-size="14">Validate — models.py</text>
  <text x="350" y="310" text-anchor="middle" class="mono">shape + cross-field rules (Q3)</text>
  <line x1="350" y1="328" x2="350" y2="348" class="fl" marker-end="url(#ar)"/>

  <!-- Version -->
  <rect x="220" y="348" width="260" height="64" rx="9" class="proc"/>
  <text x="350" y="372" text-anchor="middle" class="bl" font-size="14">Version — envelope</text>
  <text x="350" y="394" text-anchor="middle" class="mono">schema_version check (Q4)</text>
  <line x1="350" y1="412" x2="350" y2="432" class="fl" marker-end="url(#ar)"/>

  <!-- Resolve -->
  <rect x="220" y="432" width="260" height="64" rx="9" class="proc"/>
  <text x="350" y="456" text-anchor="middle" class="bl" font-size="14">Resolve — resolver.py</text>
  <text x="350" y="478" text-anchor="middle" class="mono">theme + precedence (Q2, Q7)</text>

  <line x1="350" y1="496" x2="350" y2="550" class="flC" marker-end="url(#arC)"/>

  <!-- ============ OUTPUT ============ -->
  <text x="225" y="540" class="lbl">OUTPUT · READ-ONLY</text>
  <rect x="225" y="550" width="250" height="72" rx="10" class="cfg"/>
  <text x="350" y="576" text-anchor="middle" class="bl">Resolved config object</text>
  <text x="350" y="596" text-anchor="middle" class="sb">single theme, immutable (Q6)</text>
  <text x="350" y="614" text-anchor="middle" class="mono">→ Rendering (Phase 5)</text>
</svg>
