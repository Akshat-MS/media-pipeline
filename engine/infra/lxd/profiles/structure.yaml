# ==============================================================================
# LXD profile: pipeline-structure
# Runs: Visual Deconstruction, Sequence Mapping, Resource Library matching
# Why grouped: lightweight parsing/correlation, no GPU, no heavy ML — the
# container also needs read-write access to the Resource Library since it's
# the only one that checks for / adds new matched visual assets.
#
# Applied via: bootstrap/02_create_containers.sh (which substitutes the
# {{WORKDIR_PATH}} / {{RESOURCES_PATH}} placeholders with real host paths
# before running `lxc profile edit`). Do not apply this file directly.
# ==============================================================================

description: media-pipeline — structure/analysis container (visual deconstruction, sequence mapping, resource library)

config:
  limits.cpu: "2"
  limits.memory: 2GB
  boot.autostart: "true"

devices:
  root:
    path: /
    pool: default
    type: disk
    size: 8GB

  eth0:
    name: eth0
    nictype: bridged
    parent: lxdbr0
    type: nic
    # DHCP-assigned IP from lxdbr0 — no static IP configured (per Task 4
    # decision: containers are addressed by name via `lxc exec`, never by IP)

  workdir:
    path: /workdir
    source: "{{WORKDIR_PATH}}"
    type: disk

  resources:
    path: /resources
    source: "{{RESOURCES_PATH}}"
    type: disk
    # read-write — this container is the one that adds new matched assets
    # to the Resource Library
