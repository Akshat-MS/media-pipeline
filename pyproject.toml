[project]
name = "media-pipeline"
version = "0.1.0"
description = "Local-first media automation pipeline (PPTX/MP4 -> aligned, synced video)"
requires-python = ">=3.12,<3.14"

dependencies = [
    "ffmpeg-python>=0.2",
    "python-pptx>=1.0",
    "faster-whisper>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "sqlite-utils>=3.36",
    "jiwer>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration", "slow"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
