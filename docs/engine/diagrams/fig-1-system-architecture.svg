<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1460 840" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">
          <defs>
            <marker id="ar" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="#5FD4C7"/>
            </marker>
            <marker id="arA" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/>
            </marker>
            <marker id="arG" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="#4ADE80"/>
            </marker>
            <marker id="arP" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/>
            </marker>
            <marker id="arPs" markerWidth="10" markerHeight="10" refX="2.5" refY="5" orient="auto">
              <path d="M10,0 L0,5 L10,10 z" fill="#A78BFA"/>
            </marker>
            <style>
              .bl   { fill:#E6EDF3; font-size:15px; font-weight:600; }
              .sb   { fill:#9AA6B8; font-size:11.5px; }
              .mono { fill:#5FD4C7; font-size:11.5px; font-family:'JetBrains Mono','Courier New',monospace; }
              .lbl  { fill:#6B7383; font-size:11px; font-weight:600; letter-spacing:0.16em; }
              .grpL { fill:#7E899B; font-size:12px; font-weight:700; letter-spacing:0.14em; }
              .gateT{ fill:#E8A33D; font-size:12px; font-weight:700; letter-spacing:0.03em; }
              .note { fill:#8792A3; font-size:10.5px; font-style:italic; }
              .fl   { stroke:#5FD4C7; stroke-width:1.8; fill:none; }
              .flA  { stroke:#E8A33D; stroke-width:1.8; fill:none; }
              .flG  { stroke:#4ADE80; stroke-width:2; fill:none; }
              .flP  { stroke:#A78BFA; stroke-width:1.7; fill:none; }
              .proc { fill:rgba(95,212,199,0.09); stroke:#5FD4C7; stroke-width:1.5; }
              .inp  { fill:rgba(232,163,61,0.11); stroke:#E8A33D; stroke-width:1.6; stroke-dasharray:6 4; }
              .res  { fill:rgba(167,139,250,0.10); stroke:#A78BFA; stroke-width:1.5; }
              .cfg  { fill:rgba(135,146,163,0.10); stroke:#8792A3; stroke-width:1.5; }
              .gate { fill:rgba(232,163,61,0.14); stroke:#E8A33D; stroke-width:1.3; }
              .rndr { fill:rgba(232,163,61,0.10); stroke:#E8A33D; stroke-width:1.5; }
              .grp  { fill:none; stroke:#2C3346; stroke-width:1.4; stroke-dasharray:6 5; }
              .out  { fill:rgba(74,222,128,0.13); stroke:#4ADE80; stroke-width:1.6; }
            </style>
          </defs>
        
          <rect x="0" y="0" width="1460" height="840" fill="#0B0E14"/>
        
          <!-- ============ INPUT ============ -->
          <text x="45" y="248" class="lbl">INPUT</text>
          <rect x="40" y="256" width="150" height="120" rx="11" class="inp"/>
          <text x="115" y="304" text-anchor="middle" class="bl" font-size="14">Input</text>
          <text x="115" y="330" text-anchor="middle" class="sb">slide deck (PPTX)</text>
          <text x="115" y="350" text-anchor="middle" class="sb">lecture video (MP4)</text>
        
          <!-- ============ PROCESSING group ============ -->
          <rect x="230" y="70" width="1000" height="470" rx="16" class="grp"/>
          <text x="252" y="98" class="grpL">PROCESSING</text>
        
          <!-- Visual Extraction -->
          <rect x="260" y="120" width="205" height="92" rx="9" class="proc"/>
          <text x="362" y="158" text-anchor="middle" class="bl">Visual Extraction</text>
          <text x="362" y="186" text-anchor="middle" class="mono">→ manifest.json</text>
        
          <!-- Audio Preprocessing -->
          <rect x="260" y="240" width="205" height="92" rx="9" class="proc"/>
          <text x="362" y="272" text-anchor="middle" class="bl">Audio Preprocessing</text>
          <text x="362" y="294" text-anchor="middle" class="sb">−16 LUFS · denoise · gain</text>
          <text x="362" y="316" text-anchor="middle" class="mono">→ enhanced_audio.wav</text>
        
          <!-- Transcript Alignment -->
          <rect x="260" y="360" width="205" height="92" rx="9" class="proc"/>
          <text x="362" y="398" text-anchor="middle" class="bl">Transcript Alignment</text>
          <text x="362" y="420" text-anchor="middle" class="sb">STT on enhanced audio</text>
          <text x="362" y="440" text-anchor="middle" class="mono">→ transcript.json</text>
        
          <!-- Manifest Review gate -->
          <rect x="520" y="270" width="180" height="48" rx="14" class="gate"/>
          <text x="610" y="290" text-anchor="middle" class="gateT">✓ MANIFEST</text>
          <text x="610" y="307" text-anchor="middle" class="gateT">REVIEW</text>
        
          <!-- Sequence Mapping -->
          <rect x="740" y="248" width="220" height="110" rx="9" class="proc"/>
          <text x="850" y="288" text-anchor="middle" class="bl">Sequence Mapping</text>
          <text x="850" y="312" text-anchor="middle" class="sb">correlate visuals ↔ transcript</text>
          <text x="850" y="334" text-anchor="middle" class="mono">→ plan.json (+ text)</text>
        
          <!-- Plan Review gate -->
          <rect x="740" y="380" width="220" height="42" rx="14" class="gate"/>
          <text x="850" y="406" text-anchor="middle" class="gateT">✓ PLAN REVIEW · human edit</text>
        
          <!-- Rendering & Composition sub-group -->
          <rect x="1010" y="120" width="200" height="360" rx="12" class="grp"/>
          <text x="1030" y="146" class="grpL" font-size="10.5">RENDER &amp; COMPOSE</text>
          <rect x="1030" y="188" width="160" height="92" rx="9" class="rndr"/>
          <text x="1110" y="228" text-anchor="middle" class="bl" font-size="14">HTML Build</text>
          <text x="1110" y="252" text-anchor="middle" class="sb">plan → HTML DOM</text>
          <rect x="1030" y="336" width="160" height="100" rx="9" class="rndr"/>
          <text x="1110" y="374" text-anchor="middle" class="bl" font-size="14">Video Compose</text>
          <text x="1110" y="396" text-anchor="middle" class="sb">HTML + enhanced</text>
          <text x="1110" y="414" text-anchor="middle" class="sb">audio → synced mp4</text>
        
          <!-- ============ Final Review & Delivery ============ -->
          <rect x="1270" y="190" width="160" height="100" rx="11" fill="rgba(242,107,107,0.11)" stroke="#F26B6B" stroke-width="1.6"/>
          <text x="1350" y="228" text-anchor="middle" class="bl" font-size="14">Final Review</text>
          <text x="1350" y="248" text-anchor="middle" class="bl" font-size="14">&amp; Sync QC</text>
          <text x="1350" y="270" text-anchor="middle" class="sb">render + sync</text>
        
          <rect x="1270" y="340" width="160" height="86" rx="11" class="out"/>
          <text x="1350" y="378" text-anchor="middle" class="bl" font-size="14">Delivery</text>
          <text x="1350" y="400" text-anchor="middle" class="mono" style="fill:#4ADE80;">final .mp4</text>
        
          <!-- ============ SUPPORT / ARTIFACTS LAYER ============ -->
          <rect x="230" y="590" width="1000" height="180" rx="14" class="grp"/>
          <text x="252" y="618" class="grpL">SUPPORT / ARTIFACTS LAYER</text>
        
          <rect x="300" y="638" width="300" height="106" rx="10" class="res"/>
          <text x="450" y="678" text-anchor="middle" class="bl">Resource Library</text>
          <text x="450" y="702" text-anchor="middle" class="sb">reusable icon / component set</text>
          <text x="450" y="722" text-anchor="middle" class="mono" style="fill:#A78BFA;">read + write</text>
        
          <rect x="700" y="638" width="300" height="106" rx="10" class="cfg"/>
          <text x="850" y="678" text-anchor="middle" class="bl">Config Mgmt</text>
          <text x="850" y="702" text-anchor="middle" class="sb">theme · palette · pacing</text>
          <text x="850" y="722" text-anchor="middle" class="sb" style="font-style:italic;">read-only</text>
        
          <!-- ============ FLOWS ============ -->
          <!-- input fan-out to Visual + Audio -->
          <path class="flA" d="M190,316 H225 V166 H260" marker-end="url(#arA)"/>
          <path class="flA" d="M225,286 H260" marker-end="url(#arA)"/>
        
          <!-- Audio -> Transcript -->
          <path class="fl" d="M362,332 V360" marker-end="url(#ar)"/>
        
          <!-- Visual + Transcript merge -> Manifest Review -->
          <path class="fl" d="M465,166 H500 V294"/>
          <path class="fl" d="M465,406 H500 V294"/>
          <path class="fl" d="M500,294 H520" marker-end="url(#ar)"/>
        
          <!-- Manifest Review -> Sequence Mapping -->
          <path class="fl" d="M700,294 H740" marker-end="url(#ar)"/>
        
          <!-- Sequence Mapping -> Plan Review -->
          <path class="flA" d="M850,358 V380" marker-end="url(#arA)"/>
        
          <!-- Plan Review -> HTML Build -->
          <path class="fl" d="M960,401 H985 V234 H1030" marker-end="url(#ar)"/>
        
          <!-- HTML Build -> Video Compose -->
          <path class="fl" d="M1110,280 V336" marker-end="url(#ar)"/>
        
          <!-- Video Compose -> Final QC -->
          <path class="fl" d="M1190,386 H1232 V240 H1270" marker-end="url(#ar)"/>
        
          <!-- Final QC -> Delivery -->
          <path class="flG" d="M1350,290 V340" marker-end="url(#arG)"/>
        
          <!-- Support layer -> Processing (role-level connections) -->
          <!-- Resource Library: read + write (bidirectional) -->
          <path class="flP" d="M450,638 V540" marker-start="url(#arPs)" marker-end="url(#arP)"/>
          <!-- Config Mgmt: read-only into Rendering -->
          <path class="flP" d="M850,638 V560 H1110 V480" marker-end="url(#arP)"/>
        </svg>
